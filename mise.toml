[tools]
node = "24.22.1"
ruby = "4.0.9"
gitleaks = "8.30.1"

[settings]
ruby.compile = false

[tasks.css]
description = "Build Tailwind CSS"
run = "npx @tailwindcss/cli -i ./tailwind.css -o ./docs/assets/css/tailwind.css"

[tasks.serve]
description = "Serve the Jekyll site locally"
depends = ["css"]
run = "bundle exec jekyll serve"

[tasks.validate]
description = "Build and validate generated HTML"
depends = ["css"]
run = "bundle exec jekyll build && npx html-validator _site"

[tasks.gitleaks]
description = "Scan secrets including git history"
run = "gitleaks detect --source . --verbose --redact"

[tasks."gitleaks:protect"]
description = "Scan secrets in staged changes"
run = "gitleaks protect --source . --staged --verbose --redact"

[tasks."deps:propose"]
description = "List outdated dependencies, and leave them as issues with --apply"
run = "node scripts/deps-propose.mjs"

[tasks.test]
description = "Run tests for scripts"
run = "node --test scripts/*.test.mjs"
