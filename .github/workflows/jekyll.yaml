name: jekyll

on:
  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Test Jekyll site
        run: bundle exec jekyll doctor
