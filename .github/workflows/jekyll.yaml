name: jekyll

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bundle install
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Test Jekyll site
        run: bundle exec jekyll doctor
