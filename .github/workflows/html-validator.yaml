name: html-validator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bundle install
      - run: npm ci
      # Jekyll で生成した HTML を w3c-html-validator で検証する
      - run: mise run validate
